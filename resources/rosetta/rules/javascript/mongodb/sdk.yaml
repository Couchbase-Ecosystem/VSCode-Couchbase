pattern: "unique:true"
storeAsType: MongoUniqueIndexOptions
testFile: js/mongodb/sdk/uniqueIndex.js
---
type: MongoCollection
member: createIndex
matchArgumentType: MongoUniqueIndexOptions
message: Unique indexes are not supported
level: SEVERE
