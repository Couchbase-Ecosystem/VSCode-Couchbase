# Rules for the Node.js MongoDB driver ("mongodb" package).
# Loaded from javascript.yaml, which has already captured MongoDb and
# MongoCollection instances for us.

# --- Change streams -----------------------------------------------------
type: MongoCollection
member: watch
message: Change streams are not supported
level: SEVERE
testFile: js/mongodb/sdk/changeStream.js
---
type: MongoDb
member: watch
message: Change streams are not supported
level: SEVERE
testFile: js/mongodb/sdk/dbChangeStream.js
